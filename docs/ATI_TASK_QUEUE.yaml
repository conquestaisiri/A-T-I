    result: "Introduced a configurable PaperFeeConfig (taker/maker rate as fractions of notional, frozen dataclass, negative rates rejected; defaults remain zero so the paper simulator is a fee-free deterministic baseline out of the box). PaperFillEngine now computes real fees on every filled notional (market fills and spread-crossing limit fills are taker; resting NEW orders carry 0.0). PaperTradingSimulator accepts the same fee_config: entry fee is debited from equity and the daily/monthly loss windows at open; exits book gross - exit_fee; each closed TradeRecord now records gross_pnl and realized_pnl (net = gross - entry_share - exit_fee) plus fee (entry+exit), and bracket exits charge the taker rate on exit notional because they have no gateway report. Partial closes pro-rate the entry fee and shrink the residual open record's quantity (a latent bug exposed: the record previously stayed at full quantity, so a later EXIT would over-close). Funding is modelled as an explicit separate field funding_cost on both ExecutionReport and TradeRecord and stays None in the paper sim (explicitly deferred); it is never folded into the execution fee."
    tests: "New tests/application/test_paper_fees.py (11 tests): PaperFeeConfig validation; market buy/sell fills charge taker fee on notional; zero-fee default charges nothing; funding deferred (None); full round-trip gross/net/fee/equity reconcile with hand-computed values; report and ledger agree (open record carries entry fee, ledger record carries entry+exit); funding stays None on both open and closed records; bracket exit charges the taker fee on exit notional; partial close allocates entry fee proportionally across slices and pro-rates the residual open record. Full suite: 406 passed. mypy clean on all 123 backend files. ruff clean on changed files."
    blockers: []
    completed_at: "2026-08-11"

