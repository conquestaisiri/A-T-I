[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101"]
"backend/infrastructure/data_fabric/event_bus.py" = ["E501", "SIM105", "SIM115"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = ["backend"]

[[tool.mypy.overrides]]
module = ["feedparser", "torch", "transformers", "riskfolio", "cvxpy", "pandas", "MetaTrader5", "ccxt.*"]
ignore_missing_imports = true
