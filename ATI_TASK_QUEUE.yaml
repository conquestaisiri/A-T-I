  - id: P2-001
    title: "Realistic paper execution model"
    priority: P2
    status: READY
    acceptance:
      - "Fees, spread, latency, partial fills, queue, cancellation and impact are modeled."
      - "Paper execution shares interfaces with live execution."
    blockers:
      - "P0-010"
      - "P0-011"

  - id: P2-002
    title: "Execution attribution"
    priority: P2
    status: READY
    acceptance:
      - "Arrival price is stored."
      - "Slippage is stored."
      - "Fees are stored."
      - "Maker/taker is stored."
      - "Execution cost can be attributed per strategy."
    blockers:
      - "P0-011"

  - id: P2-003
    title: "Microstructure validation harness integration"
    priority: P2
    status: READY
    acceptance:
      - "Microstructure strategies are tested through realistic fills."
      - "Randomness is seeded or controlled."
      - "Queue assumptions are documented."
    blockers:
      - "P0-005"
      - "P2-001"

  - id: P3-001
    title: "Scenario engine"
    priority: P3
    status: READY
    acceptance:
      - "Multiple scenarios are generated."
      - "Probabilities are calibrated."
      - "Expected value includes costs."
      - "Abstention is supported."
    blockers:
      - "P1-003"

  - id: P3-002
    title: "Historical analog retrieval"
    priority: P3
    status: READY
    acceptance:
      - "State similarity is measurable."
      - "Retrieval has timestamps and confidence."
      - "Weak analogs are not treated as strong evidence."
    blockers:
      - "P1-001"

  - id: P3-003
    title: "Strategy allocator"
    priority: P3
    status: READY
    acceptance:
      - "Strategies compete for risk budget."
      - "Correlation and regime fit are included."
      - "Allocator cannot bypass risk gate."
    blockers:
      - "P1-003"

  - id: P4-001
    title: "Controlled model promotion"
    priority: P4
    status: BLOCKED
    acceptance:
      - "Research → validation → paper → canary → production gates exist."
      - "Rollback is automatic and tested."
    blockers:
      - "P1-008"
      - "P2-001"
