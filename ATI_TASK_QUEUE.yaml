  - id: P4-002
    title: "Autonomous research loop"
    priority: P4
    status: BLOCKED
    acceptance:
      - "Agent can generate hypotheses."
      - "Agent can run experiments."
      - "Agent can compare evidence."
      - "Agent cannot directly deploy itself."
