# .pre-commit-config.yaml — ATI pre-commit (mirrors .git/hooks/pre-commit)
# Install: pip install pre-commit && pre-commit install
# Runs: gitleaks (via local fallback hook) + ruff + mypy subset
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks protect
        entry: bash -c 'if command -v gitleaks >/dev/null 2>&1; then gitleaks protect --staged --redact --config .gitleaks.toml --verbose; else echo "gitleaks not installed — falling back to hook script"; .git/hooks/pre-commit; fi'
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pydantic, pydantic-settings, httpx, fastapi, types-requests]
